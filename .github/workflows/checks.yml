name: Extension checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: heroamogs/flowstride-os
          ref: 390414eec858d7e2f377865da4a639e9eb7d17c5
          path: .engine-os
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Unit and formatting regression
        run: npm run test:unit
      - name: Security regression
        run: npm run test:security
      - name: Compare against the public OS parser and examples
        env:
          FLOWSTRIDE_OS_ROOT: ${{ github.workspace }}/.engine-os
        run: npm run test:parity
      - name: Audit development dependencies
        run: npm audit --audit-level=high
      - name: Package extension without publishing
        run: npm run package -- --out flowstride-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: extension-${{ matrix.os }}-node-${{ matrix.node }}
          path: flowstride-vscode.vsix
          retention-days: 14
